<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Voda Planner</title>
<script>try{var t=localStorage.getItem('vp_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#2b2622; --muted:#857b70; --line:#e7dfd1; --soft:#f0e9dc;
  --accent:#b4532a; --accent-ink:#fff;
  --p1:#b8342a; --p2:#c27c0e; --p3:#3a6ea5;
  --voda:#1f6f8b; --station:#7a4e2d; --personal:#6b5b95;
  --ok:#2f7a4f; --margin:rgba(180,83,42,.28);
  --shadow:0 1px 2px rgba(60,40,20,.06),0 6px 24px rgba(60,40,20,.08);
  --serif:'Fraunces',Georgia,serif; --sans:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#1c1916;--card:#25211d;--ink:#efe8dc;--muted:#a3998d;--line:#3a332c;--soft:#2e2924;
  --margin:rgba(214,120,80,.3);--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.3);
  --p1:#e0634f;--p2:#e0a33a;--p3:#6c9bd1;--voda:#4aa3c2;--station:#c08b5c;--personal:#9c8cc9;--ok:#5bb37f}
}
:root[data-theme="dark"]{--paper:#1c1916;--card:#25211d;--ink:#efe8dc;--muted:#a3998d;--line:#3a332c;--soft:#2e2924;
  --margin:rgba(214,120,80,.3);--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.3);
  --p1:#e0634f;--p2:#e0a33a;--p3:#6c9bd1;--voda:#4aa3c2;--station:#c08b5c;--personal:#9c8cc9;--ok:#5bb37f}
.logo{width:30px;height:30px;border-radius:8px;display:block;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.login .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 14px}
.topright{display:flex;align-items:center;gap:10px}
.themebtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink)}
.themebtn svg{width:18px;height:18px}

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
#app{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
.wide #app{max-width:1100px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.brand{font-family:var(--serif);font-weight:650;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.busy{background:var(--p2);animation:pulse 1s infinite}
.sync.err{background:var(--p1)}
@keyframes pulse{50%{opacity:.35}}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;background:var(--c,#888)}

/* date header */
.datehead{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
.datehead .navbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--muted);background:var(--card);box-shadow:var(--shadow)}
.datehead .navbtn:active{transform:scale(.96)}
.dateblock{flex:1;position:relative;min-width:0}
.dateblock .wd{font-family:var(--serif);font-weight:650;font-size:32px;line-height:1.05}
.dateblock .dt{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.dateblock input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.todaybtn{font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.todaybtn.off{background:var(--soft);color:var(--muted)}

.viewas{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:-4px 0 12px}
.viewas select{flex:1;max-width:260px}

/* quick add */
.quick{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.quick input{flex:1;min-width:0;border:0;background:none;outline:none;padding:10px 0;font-size:16px}
.qp{display:flex;gap:4px}
.qp button{width:30px;height:30px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);background:var(--soft)}
.qp button.on[data-v="1"]{background:var(--p1);color:#fff}
.qp button.on[data-v="2"]{background:var(--p2);color:#fff}
.qp button.on[data-v="3"]{background:var(--p3);color:#fff}
.quick .add{background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.quick select{border:0;background:var(--soft);border-radius:8px;padding:6px;font-size:13px;max-width:110px}
.morelink{display:block;margin:8px 2px 0;font-size:13px;color:var(--accent);font-weight:500}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px 0 6px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

.summary{font-size:13px;color:var(--muted);margin:10px 2px 6px}
.section-title{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:18px 2px 6px;font-weight:600}

/* planner page */
.page{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.page::before{content:"";position:absolute;top:0;bottom:0;left:52px;width:1px;background:var(--margin);pointer-events:none}
.empty{padding:28px 20px 28px 68px;color:var(--muted);font-size:14px;font-style:italic;font-family:var(--serif)}
.item{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--line);min-height:58px;position:relative}
.item:last-child{border-bottom:0}
.check{flex:none;width:52px;align-self:stretch;display:grid;place-items:start center;padding-top:16px}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;transition:.15s}
.item.p1 .box{border-color:var(--p1)} .item.p2 .box{border-color:var(--p2)} .item.p3 .box{border-color:var(--p3)}
.item.done .box{background:var(--ok);border-color:var(--ok)}
.box svg{width:14px;height:14px;opacity:0}
.item.done .box svg{opacity:1}
.item.moved .box{border-style:dashed;border-color:var(--line)}
.item.moved .box svg{display:none}
.body{flex:1;min-width:0;padding:13px 10px 12px 16px;cursor:pointer}
.title{font-size:16px;font-weight:500;line-height:1.3;word-wrap:break-word}
.item.done .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.item.moved .title{color:var(--muted)}
.preview{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--muted);align-items:center}
.tag{font-weight:600;font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:5px;color:#fff}
.tag.Voda{background:var(--voda)} .tag.Station{background:var(--station)} .tag.Personal{background:var(--personal)}
.tag.Team{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:1px 6px}
.tlogo{width:24px;height:24px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.12);background:#fff}
.tagwrap{display:inline-flex;align-items:center;gap:6px}
.chip .clogo{width:18px;height:18px;border-radius:50%;margin:-2px 6px -4px -4px;vertical-align:middle;box-shadow:0 0 0 1px var(--line)}
.wrow .wlogo,.mrow .wlogo{width:15px;height:15px;border-radius:50%;flex:none;align-self:center;box-shadow:0 0 0 1px var(--line)}
.carry{color:var(--p1);font-weight:600}
.timep{font-weight:600;color:var(--ink)}
.who{display:inline-flex;align-items:center;gap:4px}
.who i{width:8px;height:8px;border-radius:50%;background:var(--c,#999);display:inline-block}
.pri{flex:none;margin:12px 12px 0 0;width:30px;height:30px;border-radius:9px;font-weight:650;font-size:14px;color:#fff;font-family:var(--serif)}
.pri.p1{background:var(--p1)} .pri.p2{background:var(--p2)} .pri.p3{background:var(--p3)}
.item.done .pri,.item.moved .pri{opacity:.35}
.pri[disabled]{cursor:default}

/* week */
.weekbar{display:flex;align-items:center;gap:8px;margin:10px 0 14px}
.weekbar .wklbl{flex:1;font-family:var(--serif);font-weight:650;font-size:22px}
.seg2{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:12px}
.seg2 button{padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
.seg2 button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.week{display:grid;gap:10px}
@media (min-width:900px){.week{grid-template-columns:repeat(7,1fr)} .wide .week .wday{min-height:260px}}
.wday{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;cursor:pointer;border:2px solid transparent}
.wday.today{border-color:var(--accent)}
.wday h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-weight:650;font-size:16px}
.wday h4 small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted)}
.wrow{display:flex;gap:7px;align-items:baseline;font-size:13px;padding:3px 0;line-height:1.3}
.wrow i{flex:none;width:8px;height:8px;border-radius:50%;transform:translateY(-1px)}
.wrow i.p1{background:var(--p1)} .wrow i.p2{background:var(--p2)} .wrow i.p3{background:var(--p3)}
.wrow.done{color:var(--muted);text-decoration:line-through}
.wrow.preview{color:var(--muted);font-style:italic}
.item.preview{opacity:.72}.item.preview .box{border-style:dashed}
.pd{flex:none;width:7px;height:7px;border-radius:50%;display:inline-block}
.pd.p1{background:var(--p1)}.pd.p2{background:var(--p2)}.pd.p3{background:var(--p3)}
.pd.done{opacity:.35}.pd.preview{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--muted)}
.calbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.calbar .seg2{margin-bottom:0}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.mhead div{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600;padding:2px 0}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcell{background:var(--card);border-radius:10px;min-height:66px;padding:6px 5px;cursor:pointer;box-shadow:var(--shadow);border:2px solid transparent;display:flex;flex-direction:column;gap:4px;min-width:0}
.mcell.out{opacity:.38}
.mcell.today{border-color:var(--accent)}
.mcell .num{font-family:var(--serif);font-weight:650;font-size:14px;line-height:1}
.mcell.today .num{color:var(--accent)}
.mcell.past .num{color:var(--muted)}
.mdots{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.mdots small{font-size:10px;color:var(--muted);line-height:1}
.mrows{display:none}
.mrow{font-size:12px;line-height:1.25;display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
.mrow span{overflow:hidden;text-overflow:ellipsis}
.mrow.done{color:var(--muted);text-decoration:line-through}
.mrow.preview{color:var(--muted);font-style:italic}
.mmore{font-size:11px;color:var(--muted)}
@media (min-width:700px){.mcell{min-height:116px;padding:8px}.mrows{display:flex;flex-direction:column;gap:3px}.mdots{display:none}.mhead div{text-align:left;padding-left:8px}}
.tag.Meet{background:transparent;color:var(--p3);border:1px solid var(--p3);padding:1px 6px}
.item.appt .box{border-radius:50%}
.item.past .title{color:var(--muted)}
.loc{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--muted)}
.morelinks{display:flex;gap:18px;flex-wrap:wrap}
.wmore,.wnone{font-size:12px;color:var(--muted);padding-top:3px}

/* search & more */
.searchbox{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px;outline:none;margin:10px 0 12px}
.res{display:block;width:100%;text-align:left;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px}
.res .rdate{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.res .rtitle{font-weight:500;margin-top:2px}
.res .rnote{font-size:13px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-family:var(--serif);font-weight:650;font-size:18px}
.card p{margin:6px 0;font-size:14px;color:var(--muted);line-height:1.45}
.rule{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.rule:first-of-type{border-top:0}
.rule small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;background:var(--ink);color:var(--paper)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--p1);padding-left:0}
.btn.accent{background:var(--accent);color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.field{display:block;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav .in{display:flex;width:100%;max-width:560px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--accent)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--p1);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;min-width:16px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(30,20,10,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@media (min-width:700px){.overlay{align-items:center}}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:700px){.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-head h2{margin:0;font-family:var(--serif);font-weight:650;font-size:22px}
.x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:16px}
.lbl{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:10px;background:var(--soft);font-size:14px;font-weight:500;color:var(--muted);border:2px solid transparent}
.seg button.on{color:var(--ink);border-color:var(--ink);background:var(--card)}
.seg button.on.p1{border-color:var(--p1);color:var(--p1)} .seg button.on.p2{border-color:var(--p2);color:var(--p2)} .seg button.on.p3{border-color:var(--p3);color:var(--p3)}
.seg.days button{min-width:38px;flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea.field{min-height:90px;resize:vertical;line-height:1.4}
.info{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:10px;line-height:1.4}
.info b{color:var(--ink);font-weight:600}
.cl{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.cl input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.cl .t{flex:1;font-size:15px}
.cl .t.d{text-decoration:line-through;color:var(--muted)}
.cl .rm{color:var(--muted);font-size:18px;padding:0 6px}
.cladd{display:flex;gap:8px;margin-top:8px}
.cladd input{flex:1}
.foot{display:flex;align-items:center;gap:8px;margin-top:22px}
.foot .sp{flex:1}
.ro{font-size:15px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}

/* login */
.login{max-width:380px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 0 40px;text-align:center}
.login h1{font-family:var(--serif);font-weight:650;font-size:34px;margin:0}
.login .sub{color:var(--muted);margin:6px 0 28px;font-size:15px}
.names{display:grid;gap:10px}
.name{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px 14px;font-weight:500;font-size:17px;text-align:left}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots span.f{background:var(--ink);border-color:var(--ink)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}
.pad button{height:64px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:24px;font-family:var(--serif);font-weight:500}
.pad button:active{background:var(--soft)}
.pad .blank{visibility:hidden}
.err{color:var(--p1);font-size:14px;min-height:20px}
.back{color:var(--muted);font-size:14px;margin-top:22px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic}
</style>
</head>
<body>
<div id="app"><div class="loading">Opening your planner…</div></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =============================================================
 *  STEP 1 OF SETUP: paste your Apps Script Web App URL below
 * ============================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbwLh3KpbEaVbnx85ptYlONf-hwH5DuC9BYYRNuZK_7NwLwGhRAokUMzBfGBinQR6uub6A/exec';

/* ------------------------------------------------------------- */
const PRI_LABEL = {1:'Must do', 2:'Should do', 3:'Could do'};
const TAGS = ['Voda','Station','Personal'];
// The Personal logo only appears on this person's own planner

/* ---------- small helpers ---------- */
function pad2(n){return String(n).padStart(2,'0')}
function today(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function addDays(s,n){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5)}
function dObj(s){return new Date(s+'T12:00:00Z')}
function fmt(s,o){return dObj(s).toLocaleDateString('en-US',Object.assign({timeZone:'UTC'},o))}
function fmtShort(s){return fmt(s,{month:'short',day:'numeric'})}
function fmtRange(a,b){return b&&b>a?fmtTime(a)+' – '+fmtTime(b):fmtTime(a)}
function fmtTime(t){if(!t)return '';let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad2(m)+' '+ap}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function first(n){return String(n||'').split(' ')[0]}
function initials(n){return String(n||'').split(' ').map(x=>x[0]||'').join('').slice(0,2).toUpperCase()}
function uid(p){return (p||'i')+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function userColor(n){const u=S.users.find(x=>x.name===n);return u?u.color:'#999'}
function parseCL(c){if(Array.isArray(c))return c;try{const a=JSON.parse(c||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
function isAdmin(){return S.user&&S.user.role==='admin'}
function isManager(){return S.user&&(S.user.role==='admin'||S.user.role==='manager')}
function canEdit(it){if(isAdmin())return true;if(it.Type==='personal')return it.Owner===S.user.name;return it.CreatedBy===S.user.name||S.user.role==='manager'}
function canDelete(it){if(isAdmin())return true;if(it.Type==='personal')return it.Owner===S.user.name;return S.user.role==='manager'}

/* ---------- theme ---------- */
function getTheme(){try{return localStorage.getItem('vp_theme')||'auto'}catch(e){return 'auto'}}
function isDark(){const t=getTheme();return t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
function setTheme(t){
  try{if(t==='auto')localStorage.removeItem('vp_theme');else localStorage.setItem('vp_theme',t)}catch(e){}
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  applyThemeColor();render();
}
function applyThemeColor(){const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',isDark()?'#1c1916':'#f7f3ea')}
if(window.matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getTheme()==='auto'){applyThemeColor();render()}})}catch(e){}}

/* ---------- server calls ---------- */
async function call(action,payload){
  const body=JSON.stringify(Object.assign({action,name:S.creds&&S.creds.name,pin:S.creds&&S.creds.pin},payload||{}));
  const r=await fetch(API_URL,{method:'POST',body});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'Something went wrong');
  return j;
}
function api(action,payload){
  pending++; setSync();
  const p=queue.then(()=>call(action,payload)).finally(()=>{pending--;setSync()});
  queue=p.catch(()=>{});
  return p;
}
function setSync(err){
  S.syncState=err?'err':(pending>0?'busy':'ok');
  const el=document.querySelector('.sync');
  if(el){el.className='sync '+(S.syncState==='ok'?'':S.syncState);el.title=S.syncState==='ok'?'All changes saved':S.syncState==='busy'?'Saving…':'Could not reach the server'}
}
function mutate(action,payload,okMsg){
  api(action,payload).then(j=>{
    if(okMsg) toast(okMsg);
    if(j.data&&pending===0) applyData(j.data);
  }).catch(e=>{
    if(e.message==='AUTH'){logout('Your PIN changed — please sign in again.');return}
    toast(e.message==='Failed to fetch'?'No connection — change not saved':e.message);
    setSync(true);
    refresh(true);
  });
}
function applyData(d){
  S.items=d.items||[];S.rules=d.rules||[];S.users=d.users||S.users;
  lsSet(LS.cache,{user:S.user.name,items:S.items,rules:S.rules,users:S.users});
  render();
}
function refresh(silent){
  if(!S.creds) return Promise.resolve();
  return api('getData').then(j=>{S.user=j.user;if(pending===0)applyData(j.data)}).catch(e=>{
    if(e.message==='AUTH'){logout('Please sign in again.');return}
    setSync(true); if(!silent) toast('Could not reach the planner server');
  });
}

/* ---------- day logic: what shows on a given day ---------- */
function newestRecurMap(list){
  const m={};
  list.forEach(it=>{if(it.RecurID){(m[it.RecurID]=m[it.RecurID]||[]).push(it.Date)}});
  return m;
}
function dayEntries(D,list){
  const T=today(); const out=[]; const rec=newestRecurMap(list);
  list.forEach(it=>{
    if(it.Deleted==='Yes') return;
    const done=it.Completed==='Yes', cd=it.CompletedDate;
    if(it.Kind==='appt'){   // meetings/appointments stay on their own day
      if(it.Date===D) out.push({it,state:done?'done':(D<T?'past':'active')});
      return;
    }
    if(it.Date===D){
      if(done&&cd<=D) out.push({it,state:'done',early:cd<D?cd:null});
      else if(done) out.push({it,state:'moved',note:'Completed '+fmtShort(cd)});
      else if(D<T) out.push({it,state:'moved',note:'Moved to next day'});
      else out.push({it,state:'active',carried:0});
    } else if(it.Date<D && D<=T){
      if(done){
        if(cd===D) out.push({it,state:'done',from:it.Date});
        else if(cd>D) out.push({it,state:'moved',note:'Carried from '+fmtShort(it.Date)+' · completed '+fmtShort(cd)});
      } else {
        if(it.RecurID&&(rec[it.RecurID]||[]).some(x=>x>it.Date&&x<=D)) return; // newer copy replaces it
        if(D<T) out.push({it,state:'moved',note:'Carried from '+fmtShort(it.Date)});
        else out.push({it,state:'active',carried:daysBetween(it.Date,D)});
      }
    } else if(it.Date>D && done && cd===D){
      out.push({it,state:'done',scheduled:it.Date});
    }
  });
  const rank={active:0,past:1,done:1,moved:2};
  out.sort((a,b)=>{
    if(rank[a.state]!==rank[b.state]) return rank[a.state]-rank[b.state];
    const at=a.it.Time||'99', bt=b.it.Time||'99';
    if(a.state==='active'&&at!==bt) return at<bt?-1:1;
    const pa=+a.it.Priority||2, pb=+b.it.Priority||2;
    if(pa!==pb) return pa-pb;
    return (b.carried||0)-(a.carried||0);
  });
  return out;
}
function plannerList(owner){
  return S.items.filter(it=>(it.Type==='personal'&&it.Owner===owner)||(it.Type==='team'&&it.AssignedTo===owner));
}
function teamList(){
  const f=S.teamFilter;
  return S.items.filter(it=>{
    if(it.Type!=='team') return false;
    if(f==='all') return true;
    if(f==='open') return !it.AssignedTo||it.AssignedTo==='Anyone';
    return it.AssignedTo===f;
  });
}
function ruleMatches(r,d){
  const dt=dObj(d), dow=dt.getUTCDay();
  if(r.Freq==='daily') return true;
  if(r.Freq==='weekdays') return dow>=1&&dow<=5;
  if(r.Freq==='weekly') return String(r.Days||'').split(',').filter(String).map(Number).indexOf(dow)>=0;
  if(r.Freq==='monthly'){const want=+r.Days||1;const last=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();return dt.getUTCDate()===Math.min(want,last)}
  return false;
}
function plannerRules(owner){return S.rules.filter(r=>(r.Type==='personal'&&r.Owner===owner)||(r.Type==='team'&&r.AssignedTo===owner))}
function teamRules(useFilter){
  const f=useFilter?S.teamFilter:'all';
  return S.rules.filter(r=>{if(r.Type!=='team')return false;if(f==='all')return true;if(f==='open')return !r.AssignedTo||r.AssignedTo==='Anyone';return r.AssignedTo===f});
}
// Future copies of repeating items that haven't been created yet (so you can plan months ahead)
function repeatPreviews(D,rules,list){
  if(D<=today()) return [];
  const out=[];
  rules.forEach(r=>{
    if(r.Active==='No'||D<r.StartDate||(r.LastGenerated&&D<=r.LastGenerated)||!ruleMatches(r,D)) return;
    if(list.some(it=>it.RecurID===r.ID&&it.Date===D)) return;
    out.push({state:'preview',it:{ID:'rule:'+r.ID,Type:r.Type,Owner:r.Owner,Title:r.Title,Notes:r.Notes,Priority:r.Priority,Tag:r.Tag,Time:r.Time,
      AssignedTo:r.AssignedTo,CreatedBy:r.CreatedBy,Checklist:r.Checklist,RecurID:r.ID,Date:D,Kind:r.Kind||'',EndTime:r.EndTime||'',Location:r.Location||''}});
  });
  return out.sort((a,b)=>((a.it.Time||'99')<(b.it.Time||'99')?-1:1)||((+a.it.Priority||2)-(+b.it.Priority||2)));
}
function entriesFor(D,list,rules){return dayEntries(D,list).concat(repeatPreviews(D,rules,list))}
function applyTag(entries){
  if(S.tagFilter==='all') return entries;
  return entries.filter(e=>e.it.Tag===S.tagFilter);
}

/* ---------- rendering ---------- */
function render(){
  const app=document.getElementById('app');
  // keep whatever the user is typing when the screen refreshes
  const ae=document.activeElement; let keep=null;
  if(ae&&ae.id&&app.contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) keep={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  const qv=document.getElementById('quickInput'); const quickVal=qv?qv.value:'';

  document.body.classList.toggle('wide',S.tab==='week');
  if(API_URL.indexOf('PASTE_')===0){app.innerHTML=setupNeeded();return}
  if(!S.user){app.innerHTML=renderLogin();return}
  let body='';
  if(S.tab==='day') body=renderDay();
  else if(S.tab==='team') body=renderTeam();
  else if(S.tab==='week') body=renderWeek();
  else if(S.tab==='search') body=renderSearch();
  else body=renderMore();
  app.innerHTML=renderTop()+body+renderNav();

  const q=document.getElementById('quickInput'); if(q&&quickVal) q.value=quickVal;
  if(keep){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}

function setupNeeded(){
  return `<div class="login"><h1>Almost there</h1><p class="sub">Open <b>index.html</b> and paste your Apps Script Web App URL into <code>API_URL</code> near the top of the script, then upload it again.</p></div>`;
}

}

function dateHead(){
  const T=today(); const isT=S.date===T;
  const rel=isT?'Today · ':S.date===addDays(T,1)?'Tomorrow · ':S.date===addDays(T,-1)?'Yesterday · ':'';
  return `<div class="datehead">
    <button class="navbtn" data-act="day-prev" aria-label="Previous day">‹</button>
    <div class="dateblock"><div class="wd">${fmt(S.date,{weekday:'long'})}</div>
      <div class="dt">${rel}${fmt(S.date,{month:'long',day:'numeric',year:'numeric'})}</div>
      <input type="date" id="datePick" value="${S.date}" aria-label="Pick a date"></div>
    <button class="navbtn" data-act="day-next" aria-label="Next day">›</button>
    <button class="todaybtn ${isT?'off':''}" data-act="go-today">Today</button></div>`;
}

function quickAdd(team){
  const pri=[1,2,3].map(v=>`<button type="button" data-act="qpri" data-v="${v}" class="${S.quickPri===v?'on':''}" title="${PRI_LABEL[v]}">${v}</button>`).join('');
  const assign=team?`<select id="quickAssign" aria-label="Assign to"><option value="Anyone">Anyone</option>${S.users.map(u=>`<option ${S.quickAssign===u.name?'selected':''} value="${esc(u.name)}">${esc(first(u.name))}</option>`).join('')}</select>`:'';
  return `<form class="quick" id="quickForm" data-team="${team?1:0}">
    <input id="quickInput" placeholder="${team?'Add a team task…':'Add something to do…'}" autocomplete="off" enterkeyhint="done">
    ${assign}<div class="qp">${pri}</div><button type="submit" class="add">Add</button></form>
    <div class="morelinks"><button class="morelink" data-act="new-full" data-team="${team?1:0}">+ Add with notes, time, steps or repeat</button>
    <button class="morelink" data-act="new-appt" data-team="${team?1:0}">🕘 + Add a meeting / appointment</button></div>`;
}

function tagChips(owner){
  const opts=[['all','All']].concat(TAGS.map(t=>[t,t]));
  return `<div class="chips">${opts.map(([v,l])=>{const lg=v!=='all'?logoFor(v,owner):null;
    const mark=v==='all'?'':(lg?`<img class="clogo" src="${lg}" alt="">`:`<span class="dot" style="background:var(--${v.toLowerCase()})"></span>`);
    return `<button class="chip ${S.tagFilter===v?'on':''}" data-act="tagf" data-v="${v}">${mark}${l}</button>`}).join('')}</div>`;
}

function listHTML(entries,emptyMsg){
  if(!entries.length) return `<div class="page"><div class="empty">${emptyMsg}</div></div>`;
  const sched=entries.filter(e=>e.it.Kind==='appt').sort((a,b)=>((a.it.Time||'99')<(b.it.Time||'99')?-1:1));
  const rest=entries.filter(e=>e.it.Kind!=='appt');
  const active=rest.filter(e=>e.state==='active'), done=rest.filter(e=>e.state==='done'), moved=rest.filter(e=>e.state==='moved'), prev=rest.filter(e=>e.state==='preview');
  let h='';
  if(sched.length) h+=`<div class="section-title" style="margin-top:4px">Schedule (${sched.length})</div><div class="page">${sched.map(itemHTML).join('')}</div>`;
  if(active.length) h+=`${sched.length?'<div class="section-title">To do</div>':''}<div class="page">${active.map(itemHTML).join('')}</div>`;
  else if(!prev.length&&!sched.length) h+=`<div class="page"><div class="empty">${S.date<today()?'Nothing left open on this day.':'All clear — nothing left to do. 🎉'}</div></div>`;
  if(prev.length) h+=`<div class="section-title">Repeating — will appear on this day (${prev.length})</div><div class="page">${prev.map(itemHTML).join('')}</div>`;
  if(done.length) h+=`<div class="section-title">Done (${done.length})</div><div class="page">${done.map(itemHTML).join('')}</div>`;
  if(moved.length) h+=`<div class="section-title">Moved forward (${moved.length})</div><div class="page">${moved.map(itemHTML).join('')}</div>`;
  return h;
}

function itemHTML(e){
  const it=e.it, p=+it.Priority||2, cl=parseCL(it.Checklist), cld=cl.filter(x=>x.d).length;
  const m=[];
  const appt=it.Kind==='appt';
  if(it.Time) m.push(`<span class="timep">${appt?'🕘 ':''}${appt?fmtRange(it.Time,it.EndTime):fmtTime(it.Time)}</span>`);
  if(appt) m.push(`<span class="tag Meet">Meeting</span>`);
  if(appt&&it.Location) m.push(`<a class="loc" data-act="link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(it.Location)}">📍 ${esc(it.Location)}</a>`);
  if(e.state==='past') m.push(`<span>Past</span>`);
  if(it.Type==='team'&&S.tab==='day') m.push(`<span class="tag Team">Team</span>`);
  if(it.Tag){const lg=logoFor(it.Tag,it.Owner);m.push(`<span class="tagwrap">${lg?`<img class="tlogo" src="${lg}" alt="">`:''}<span class="tag ${esc(it.Tag)}">${esc(it.Tag)}</span></span>`)}
  if(e.state==='active'&&e.carried>0) m.push(`<span class="carry">↻ Carried ${e.carried} day${e.carried===1?'':'s'}</span>`);
  if(e.state==='done'&&e.from) m.push(`<span>From ${fmtShort(e.from)}</span>`);
  if(e.state==='done'&&e.scheduled) m.push(`<span>Done early (was set for ${fmtShort(e.scheduled)})</span>`);
  if(e.state==='done'&&e.early) m.push(`<span>Done early on ${fmtShort(e.early)}</span>`);
  if(e.state==='moved') m.push(`<span>→ ${esc(e.note)}</span>`);
  if(e.state==='preview') m.push(`<span>Scheduled repeat · tap to edit the series</span>`);
  if(cl.length) m.push(`<span>☑ ${cld}/${cl.length} steps</span>`);
  if(it.RecurID) m.push(`<span title="Repeating">⟳ Repeats</span>`);
  if(it.Type==='team'){
    const a=it.AssignedTo&&it.AssignedTo!=='Anyone'?it.AssignedTo:null;
    m.push(`<span class="who">For ${a?`<i style="--c:${esc(userColor(a))}"></i>${esc(first(a))}`:'Anyone'}</span>`);
    m.push(`<span>Set up by ${esc(first(it.CreatedBy))}</span>`);
    if(e.state==='done'&&it.CompletedBy) m.push(`<span class="who"><i style="--c:${esc(userColor(it.CompletedBy))}"></i>Done by ${esc(first(it.CompletedBy))}</span>`);
  }
  const prev=it.Notes?`<div class="preview">✎ ${esc(it.Notes.split('\n')[0])}</div>`:'';
  const editable=e.state!=='preview'&&canEdit(it);
  const checkAttr=e.state==='moved'?'disabled title="Already moved forward"':(e.state==='preview'?'disabled title="You can check this off on the day"':'');
  return `<div class="item p${p} ${e.state} ${appt?'appt':''}" data-id="${esc(it.ID)}">
    <button class="check" data-act="toggle" ${checkAttr} aria-label="Check off"><span class="box">${ICON.check}</span></button>
    <div class="body" data-act="open"><div class="title">${esc(it.Title)}</div>${prev}<div class="meta">${m.join('')}</div></div>
    <button class="pri p${p}" data-act="cycle" ${editable?'title="Tap to change importance"':'disabled title="Importance"'}>${p}</button></div>`;
}

function renderDay(){
  const owner=S.viewAs||S.user.name;
  const entries=applyTag(entriesFor(S.date,plannerList(owner),plannerRules(owner)));
  const active=entries.filter(e=>e.state==='active').length, done=entries.filter(e=>e.state==='done').length;
  let viewas='';
  if(isAdmin()&&S.users.length>1){
    viewas=`<div class="viewas">Viewing <select class="field" id="viewAs">${S.users.map(u=>`<option ${u.name===owner?'selected':''} value="${esc(u.name)}">${u.name===S.user.name?'My planner':esc(u.name)+"'s planner"}</option>`).join('')}</select></div>`;
  }
  return dateHead()+viewas+quickAdd(false)+tagChips(owner)+
    `<div class="summary">${active} to do · ${done} done${owner!==S.user.name?` · ${esc(first(owner))}'s planner`:''}</div>`+
    listHTML(entries,S.date<today()?'Nothing was planned for this day.':'Nothing planned yet. Add your first item above.');
}

function renderTeam(){
  const entries=applyTag(entriesFor(S.date,teamList(),teamRules(true)));
  const active=entries.filter(e=>e.state==='active').length, done=entries.filter(e=>e.state==='done').length;
  const opts=[['all','Everyone'],['open','Open to anyone']].concat(S.users.map(u=>[u.name,u.name===S.user.name?'Assigned to me':first(u.name)]));
  const chips=`<div class="chips">${opts.map(([v,l])=>`<button class="chip ${S.teamFilter===v?'on':''}" data-act="teamf" data-v="${esc(v)}">${v!=='all'&&v!=='open'?`<span class="dot" style="background:${esc(userColor(v))}"></span>`:''}${esc(l)}</button>`).join('')}</div>`;
  return dateHead()+quickAdd(true)+chips+tagChips()+
    `<div class="summary">Team calendar · ${active} open · ${done} done</div>`+
    listHTML(entries,S.date<today()?'No team tasks on this day.':'No team tasks yet. Add one above and assign it to someone.');
}

function weekStartOf(d){return addDays(d,-dObj(d).getUTCDay())}
function calSource(){
  if(S.weekMode==='team') return {list:S.items.filter(it=>it.Type==='team'),rules:teamRules(false),owner:''};
  const o=S.viewAs||S.user.name; return {list:plannerList(o),rules:plannerRules(o),owner:o};
}
function navBtn(act,ch,label){return `<button class="navbtn" data-act="${act}" aria-label="${label}" style="width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px;color:var(--muted);flex:none">${ch}</button>`}
function calToggles(src){
  return `<div class="calbar"><div class="seg2"><button class="${S.calView==='week'?'on':''}" data-act="calview" data-v="week">Week</button><button class="${S.calView==='month'?'on':''}" data-act="calview" data-v="month">Month</button></div>
    <div class="seg2"><button class="${S.weekMode==='mine'?'on':''}" data-act="wkmode" data-v="mine">${S.viewAs&&S.viewAs!==S.user.name?esc(first(S.viewAs))+"'s planner":'My planner'}</button><button class="${S.weekMode==='team'?'on':''}" data-act="wkmode" data-v="team">Team</button></div></div>
    ${tagChips(src.owner)}`;
}
function renderWeek(){ return S.calView==='month'?renderMonth():renderWeekGrid(); }
function renderWeekGrid(){
  if(!S.weekStart) S.weekStart=weekStartOf(S.date);
  const ws=S.weekStart, we=addDays(ws,6), T=today(), src=calSource();
  let days='';
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    const en=applyTag(entriesFor(d,src.list,src.rules)).filter(e=>e.state!=='moved');
    const a=en.filter(e=>e.state==='active'||e.state==='preview').length, dn=en.filter(e=>e.state==='done').length;
    const shown=en.slice(0,7);
    const rows=shown.map(e=>{const lg=e.it.Tag?logoFor(e.it.Tag,e.it.Owner):null;return `<div class="wrow ${e.state}"><i class="p${+e.it.Priority||2}"></i>${lg?`<img class="wlogo" src="${lg}" alt="">`:''}<span>${e.state==='preview'?'⟳ ':''}${e.it.Time?`<b>${fmtTime(e.it.Time)}</b> `:''}${esc(e.it.Title)}</span></div>`}).join('');
    days+=`<div class="wday ${d===T?'today':''}" data-act="goday" data-d="${d}">
      <h4>${DOW[i]} ${fmt(d,{day:'numeric'})}<small>${a?a+' open':''}${a&&dn?' · ':''}${dn?dn+' done':''}</small></h4>
      ${rows||'<div class="wnone">—</div>'}${en.length>7?`<div class="wmore">+${en.length-7} more</div>`:''}</div>`;
  }
  const label=fmt(ws,{month:'short',day:'numeric'})+' – '+fmt(we,{month:(dObj(ws).getUTCMonth()!==dObj(we).getUTCMonth()?'short':undefined),day:'numeric'});
  return `<div class="weekbar">${navBtn('wk-prev','‹','Previous week')}<div class="wklbl">${label}</div>
    <button class="todaybtn ${ws===weekStartOf(T)?'off':''}" data-act="wk-today">This week</button>${navBtn('wk-next','›','Next week')}</div>
    ${calToggles(src)}<div class="week">${days}</div>
    <p class="summary">Tap a day to open it and add or edit items. Unfinished items roll forward to today; ⟳ marks upcoming repeating items.</p>`;
}
function monthStartOf(d){return d.slice(0,8)+'01'}
function shiftMonth(ms,n){const d=dObj(ms);return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1,12)).toISOString().slice(0,10)}
function renderMonth(){
  if(!S.monthStart) S.monthStart=monthStartOf(S.date);
  const ms=S.monthStart, T=today(), src=calSource(), md=dObj(ms);
  const daysIn=new Date(Date.UTC(md.getUTCFullYear(),md.getUTCMonth()+1,0)).getUTCDate();
  const gridStart=weekStartOf(ms), gridEnd=addDays(weekStartOf(ms.slice(0,8)+pad2(daysIn)),6);
  let cells='';
  for(let d=gridStart; d<=gridEnd; d=addDays(d,1)){
    const out=d.slice(0,7)!==ms.slice(0,7);
    const en=applyTag(entriesFor(d,src.list,src.rules)).filter(e=>e.state!=='moved');
    const dots=en.slice(0,6).map(e=>`<i class="pd p${+e.it.Priority||2} ${e.state==='done'?'done':''} ${e.state==='preview'?'preview':''}"></i>`).join('')+(en.length>6?`<small>+${en.length-6}</small>`:'');
    const rows=en.slice(0,4).map(e=>{const lg=e.it.Tag?logoFor(e.it.Tag,e.it.Owner):null;
      return `<div class="mrow ${e.state}"><i class="pd p${+e.it.Priority||2}"></i>${lg?`<img class="wlogo" src="${lg}" alt="">`:''}<span>${e.state==='preview'?'⟳ ':''}${e.it.Time?fmtTime(e.it.Time).replace(':00','')+' ':''}${esc(e.it.Title)}</span></div>`}).join('')+(en.length>4?`<div class="mmore">+${en.length-4} more</div>`:'');
    cells+=`<div class="mcell ${out?'out':''} ${d===T?'today':''} ${d<T?'past':''}" data-act="goday" data-d="${d}" title="${fmt(d,{weekday:'long',month:'long',day:'numeric'})}">
      <span class="num">${+d.slice(8)}</span><div class="mdots">${dots}</div><div class="mrows">${rows}</div></div>`;
  }
  return `<div class="weekbar">${navBtn('mo-prev','‹','Previous month')}<div class="wklbl">${fmt(ms,{month:'long',year:'numeric'})}</div>
    <button class="todaybtn ${ms===monthStartOf(T)?'off':''}" data-act="mo-today">This month</button>${navBtn('mo-next','›','Next month')}</div>
    ${calToggles(src)}
    <div class="mhead">${DOW.map(x=>`<div>${x}</div>`).join('')}</div><div class="month">${cells}</div>
    <p class="summary">Tap any day to open it — you can add items to any future date to plan months ahead. Dots are colored by importance; hollow dots (⟳) are upcoming repeating items.</p>`;
}

function renderSearch(){
  const q=S.search.trim().toLowerCase();
  let res='';
  if(q.length>=2){
    const hits=S.items.filter(it=>{
      const hay=(it.Title+' '+it.Notes+' '+parseCL(it.Checklist).map(x=>x.t).join(' ')+' '+(it.AssignedTo||'')).toLowerCase();
      return hay.indexOf(q)>=0;
    }).sort((a,b)=>a.Date<b.Date?1:-1).slice(0,80);
    res=hits.length?hits.map(it=>{
      const st=it.Completed==='Yes'?'✓ Done '+fmtShort(it.CompletedDate):(it.Date<today()?'Open · carried':'Open');
      const who=it.Type==='team'?'Team · set up by '+first(it.CreatedBy):(it.Owner!==S.user.name?first(it.Owner)+"'s planner":'My planner');
      return `<button class="res" data-act="openres" data-id="${esc(it.ID)}"><div class="rdate">${fmt(it.Date,{weekday:'short',month:'short',day:'numeric',year:'numeric'})} · ${esc(st)}</div>
        <div class="rtitle">${esc(it.Title)}</div>${it.Notes?`<div class="rnote">${esc(it.Notes.split('\n')[0])}</div>`:''}<div class="rnote">${esc(who)}</div></button>`;
    }).join(''):`<p class="summary">No matches for “${esc(S.search)}”.</p>`;
  } else res=`<p class="summary">Search every day — titles, notes, checklist steps and names.</p>`;
  return `<input class="searchbox" id="searchInput" type="search" placeholder="Search items and notes…" value="${esc(S.search)}" autocomplete="off">${res}`;
}

function freqText(r){
  if(r.Freq==='daily') return 'Every day';
  if(r.Freq==='weekdays') return 'Every weekday (Mon–Fri)';
  if(r.Freq==='weekly') return 'Every '+String(r.Days||'').split(',').filter(String).map(n=>DOW[+n]).join(', ');
  if(r.Freq==='monthly') return 'Monthly on the '+ordinal(+r.Days||1);
  return '';
}

function renderMore(){
  const rules=S.rules.slice().sort((a,b)=>a.Title.localeCompare(b.Title));
  const rl=rules.length?rules.map(r=>`<button class="rule" data-act="openrule" data-id="${esc(r.ID)}"><span><b style="font-weight:500">${esc(r.Title)}</b>
    <small>${esc(freqText(r))}${r.Time?' at '+fmtTime(r.Time):''} · ${r.Type==='team'?'Team'+(r.AssignedTo&&r.AssignedTo!=='Anyone'?' → '+esc(first(r.AssignedTo)):''):(r.Owner===S.user.name?'Mine':esc(first(r.Owner)))}</small></span><span style="color:var(--muted)">›</span></button>`).join(''):'<p>No repeating items yet.</p>';
  return `<div class="card" style="margin-top:10px;display:flex;align-items:center;gap:12px"><div class="avatar" style="--c:${esc(S.user.color)};width:46px;height:46px;font-size:16px">${esc(initials(S.user.name))}</div>
      <div><div style="font-weight:600;font-size:17px">${esc(S.user.name)}</div><div style="font-size:13px;color:var(--muted);text-transform:capitalize">${esc(S.user.role)}</div></div></div>
    <div class="card"><h3>Repeating items</h3><p>Things that come up on a schedule — payroll, weekly meetings, monthly bills. They appear on their days automatically.</p>
      <div style="margin-top:8px">${rl}</div>
      <div class="btnrow"><button class="btn ghost" data-act="newrule" data-team="0">+ Repeating for me</button><button class="btn ghost" data-act="newrule" data-team="1">+ Repeating team task</button></div></div>
    <div class="card"><h3>Appearance</h3><p>Auto follows your phone or computer’s own light/dark setting.</p>
      <div class="seg" style="margin-top:10px">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([v,l])=>`<button type="button" class="${getTheme()===v?'on':''}" data-act="theme-set" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div class="card"><h3>Change my PIN</h3>
      <div class="row2"><input class="field" id="pin1" inputmode="numeric" maxlength="4" placeholder="New PIN" type="password" autocomplete="off"><input class="field" id="pin2" inputmode="numeric" maxlength="4" placeholder="Repeat it" type="password" autocomplete="off"></div>
      <div class="btnrow"><button class="btn" data-act="savepin">Save PIN</button></div></div>
    <div class="card"><h3>Put it on your home screen</h3>
      <p><b>iPhone:</b> open this page in Safari → tap the Share button → “Add to Home Screen”.</p>
      <p><b>Android:</b> open in Chrome → tap ⋮ → “Add to Home screen” or “Install app”.</p>
      <p><b>Laptop:</b> bookmark this page, or in Chrome click the install icon in the address bar.</p></div>
    ${isAdmin()?`<div class="card"><h3>Staff &amp; PINs</h3><p>To add someone, remove someone (set Active to “No”), reset a PIN, make someone a manager, or turn on morning emails, open the planner’s Google Sheet → <b>Users</b> tab.</p></div>`:''}
    <div class="btnrow" style="margin:6px 0 20px"><button class="btn ghost" data-act="refresh">Refresh now</button><button class="btn danger" data-act="logout">Sign out</button></div>`;
}

function renderNav(){
  const T=today();
  const myOpen=dayEntries(T,plannerList(S.user.name)).filter(e=>e.state==='active').length;
  const teamOpen=dayEntries(T,S.items.filter(it=>it.Type==='team'&&(it.AssignedTo===S.user.name||!it.AssignedTo||it.AssignedTo==='Anyone'))).filter(e=>e.state==='active').length;
  const tabs=[['day','My Day',ICON.day,myOpen],['team','Team',ICON.team,teamOpen],['week','Calendar',ICON.week,0],['search','Search',ICON.search,0],['more','More',ICON.more,0]];
  return `<nav class="nav"><div class="in">${tabs.map(([k,l,ic,n])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-tab="${k}">${ic}${n?`<span class="badge">${n}</span>`:''}${l}</button>`).join('')}</div></nav>`;
}

/* ---------- login ---------- */
function renderLogin(){
  if(!S.loginName){
    const names=S.users.length?S.users.map(u=>`<button class="name" data-act="pickname" data-n="${esc(u.name)}"><span class="avatar" style="--c:${esc(u.color)}">${esc(initials(u.name))}</span>${esc(u.name)}</button>`).join(''):`<p class="sub">Loading team…</p>`;
    return `<div class="login"><img class="logo" src="icon-192.png" alt=""><h1>Voda Planner</h1><p class="sub">Who’s planning today?</p><div class="names">${names}</div></div>`;
  }
  const dots=[0,1,2,3].map(i=>`<span class="${i<S.pin.length?'f':''}"></span>`).join('');
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?'<button class="blank"></button>':`<button data-act="key" data-k="${k}">${k}</button>`).join('');
  return `<div class="login"><img class="logo" src="icon-192.png" alt=""><h1>Hi, ${esc(first(S.loginName))}</h1><p class="sub">Enter your 4-digit PIN</p>
    <div class="dots ${S.loginErr?'shake':''}">${dots}</div><div class="err">${esc(S.loginErr)}</div>
    <div class="pad">${keys}</div><button class="back" data-act="loginback">‹ Not ${esc(first(S.loginName))}?</button></div>`;
}
function pressKey(k){
  if(k==='⌫'){S.pin=S.pin.slice(0,-1);S.loginErr='';render();return}
  if(S.pin.length>=4) return;
  S.pin+=k;S.loginErr='';render();
  if(S.pin.length===4) doLogin();
}
function doLogin(){
  S.creds={name:S.loginName,pin:S.pin};
  call('login').then(j=>{
    S.user=j.user;lsSet(LS.creds,S.creds);S.pin='';S.viewAs=null;S.tab='day';S.date=today();
    applyData(j.data);
  }).catch(e=>{
    S.creds=null;S.pin='';
    S.loginErr=e.message==='AUTH'?'That PIN didn’t match. Try again.':'Can’t reach the planner — check your connection.';
    render();
  });
}
function logout(msg){
  lsDel(LS.creds);lsDel(LS.cache);S.creds=null;S.user=null;S.items=[];S.rules=[];S.loginName=null;S.pin='';
  closeModal();render();if(msg)toast(msg);loadUsers();
}
function loadUsers(){
  call('users').then(j=>{S.users=j.users;lsSet(LS.users,j.users);if(!S.user)render()}).catch(()=>{if(!S.user){S.loginErr='';render();toast('Can’t reach the planner server')}});
}

/* ---------- item actions ---------- */
function findItem(id){return S.items.find(x=>x.ID===id)}
function toggleItem(id){
  const it=findItem(id); if(!it) return;
  const nowDone=it.Completed!=='Yes';
  it.Completed=nowDone?'Yes':''; it.CompletedDate=nowDone?today():''; it.CompletedBy=nowDone?S.user.name:'';
  render();
  mutate('setComplete',{id,completed:nowDone});
}
function cyclePriority(id){
  const it=findItem(id); if(!it||!canEdit(it)) return;
  it.Priority=String((+it.Priority||2)%3+1);
  render(); toast('Importance: '+it.Priority+' – '+PRI_LABEL[it.Priority]);
  mutate('saveItem',{item:it});
}
function quickSubmit(form){
  const input=document.getElementById('quickInput'); const title=input.value.trim();
  if(!title){input.focus();return}
  const team=form.dataset.team==='1';
  const T=today(); let date=S.date;
  if(date<T){date=T;toast('Added to today (that day has passed)')}
  const owner=S.viewAs||S.user.name;
  const it={ID:uid('i'),Kind:'',EndTime:'',Location:'',Type:team?'team':'personal',Owner:team?'':owner,Title:title,Notes:'',Priority:String(S.quickPri),
    Tag:S.tagFilter!=='all'?S.tagFilter:'',Date:date,Time:'',AssignedTo:team?(document.getElementById('quickAssign').value||'Anyone'):'',
    CreatedBy:S.user.name,CreatedAt:new Date().toISOString(),Completed:'',CompletedDate:'',CompletedBy:'',Checklist:'',RecurID:'',Deleted:''};
  if(team) S.quickAssign=it.AssignedTo;
  S.items.push(it); input.value='';
  render(); const q=document.getElementById('quickInput'); if(q) q.focus();
  mutate('saveItem',{item:it});
}

/* ---------- editor ---------- */
function openEditor(opts){
  const T=today();
  if(opts.item){
    const it=opts.item;
    F={mode:'item',isNew:false,ID:it.ID,Type:it.Type,origType:it.Type,Owner:it.Owner,Title:it.Title,Notes:it.Notes||'',Priority:+it.Priority||2,Tag:it.Tag||'',
      Date:it.Date,Time:it.Time||'',Kind:it.Kind||'',EndTime:it.EndTime||'',Location:it.Location||'',AssignedTo:it.AssignedTo||'Anyone',Checklist:parseCL(it.Checklist).map(x=>({t:x.t,d:!!x.d})),
      Freq:'none',Days:[],RecurID:it.RecurID,CreatedBy:it.CreatedBy,CreatedAt:it.CreatedAt,Completed:it.Completed==='Yes',CompletedBy:it.CompletedBy,CompletedDate:it.CompletedDate,
      readOnly:!canEdit(it)};
  } else if(opts.rule){
    const r=opts.rule;
    F={mode:'rule',isNew:false,ID:r.ID,Type:r.Type,Owner:r.Owner,Title:r.Title,Notes:r.Notes||'',Priority:+r.Priority||2,Tag:r.Tag||'',
      Date:r.StartDate,Time:r.Time||'',Kind:r.Kind||'',EndTime:r.EndTime||'',Location:r.Location||'',AssignedTo:r.AssignedTo||'Anyone',Checklist:parseCL(r.Checklist),Freq:r.Freq,
      Days:r.Freq==='weekly'?String(r.Days||'').split(',').filter(String).map(Number):[],CreatedBy:r.CreatedBy,readOnly:!canEdit(r)};
  } else {
    const team=!!opts.team; const d=S.date<T?T:S.date;
    F={mode:opts.ruleMode?'rule':'item',isNew:true,ID:null,Type:team?'team':'personal',Owner:team?'':(S.viewAs||S.user.name),Title:'',Notes:'',
      Priority:S.quickPri,Tag:S.tagFilter!=='all'?S.tagFilter:'',Date:d,Time:'',Kind:opts.appt?'appt':'',EndTime:'',Location:'',AssignedTo:team?(S.teamFilter!=='all'&&S.teamFilter!=='open'?S.teamFilter:'Anyone'):'',
      Checklist:[],Freq:opts.ruleMode?'weekly':'none',Days:[dObj(d).getUTCDay()],readOnly:false};
  }
  renderModal();
  if(F.isNew) setTimeout(()=>{const t=document.getElementById('f_title');if(t)t.focus()},60);
}
function syncForm(){
  if(!F||F.readOnly) return;
  const g=id=>document.getElementById(id);
  if(g('f_title')) F.Title=g('f_title').value;
  if(g('f_notes')) F.Notes=g('f_notes').value;
  if(g('f_date')) F.Date=g('f_date').value||F.Date;
  if(g('f_time')) F.Time=g('f_time').value;
  if(g('f_end')) F.EndTime=g('f_end').value;
  if(g('f_loc')) F.Location=g('f_loc').value;
  if(g('f_assign')) F.AssignedTo=g('f_assign').value;
  if(g('f_freq')) F.Freq=g('f_freq').value;
  document.querySelectorAll('[data-cl-text]').forEach(el=>{const i=+el.dataset.clText;if(F.Checklist[i])F.Checklist[i].t=el.value});
}
function renderModal(){
  const m=document.getElementById('modal');
  if(!F){m.innerHTML='';return}
  const ro=F.readOnly, team=F.Type==='team';
  const noun=F.Kind==='appt'?(team?'team meeting':'meeting'):(team?'team task':'item');
  const title=F.mode==='rule'?(F.isNew?'New repeating '+noun:'Repeating '+noun):
    (F.isNew?'New '+noun:(F.Kind==='appt'?'Edit '+noun:(team?'Team task':'Edit item')));
  let info='';
  if(!F.isNew&&team) info+=`<div class="info">Set up by <b>${esc(F.CreatedBy)}</b>${F.CreatedAt?' on '+fmtShort(F.CreatedAt.slice(0,10)):''}${F.Completed?` · Completed by <b>${esc(F.CompletedBy)}</b> on ${fmtShort(F.CompletedDate)}`:''}${ro?'<br>Only the person who set this up, a manager, or Clint can change it — but you can check it off and tick steps.':''}</div>`;
  else if(!F.isNew&&F.Completed&&F.mode==='item') info+=`<div class="info">Completed on <b>${fmtShort(F.CompletedDate)}</b>${F.Date<F.CompletedDate?' (originally planned for '+fmtShort(F.Date)+')':''}</div>`;
  if(F.mode==='item'&&F.RecurID) info+=`<div class="info">This is one day of a repeating item. Changes here affect <b>this day only</b>. To change the whole series go to More → Repeating items.</div>`;
  if(!F.isNew&&F.mode==='item'&&F.Type==='personal'&&F.Owner&&F.Owner!==S.user.name) info+=`<div class="info">In <b>${esc(F.Owner)}</b>’s planner</div>`;

  const cl=F.Checklist.map((x,i)=>`<div class="cl"><input type="checkbox" data-act="cl-toggle" data-i="${i}" ${x.d?'checked':''}>
    ${ro?`<span class="t ${x.d?'d':''}">${esc(x.t)}</span>`:`<input class="field t" style="padding:7px 9px" data-cl-text="${i}" value="${esc(x.t)}">`}
    ${ro?'':`<button class="rm" data-act="cl-rm" data-i="${i}" aria-label="Remove step">✕</button>`}</div>`).join('');

  let body;
  if(ro){
    body=`<div class="lbl">Task</div><div class="ro" style="font-weight:600;font-size:18px">${esc(F.Title)}</div>
      ${F.Notes?`<div class="lbl">Notes</div><div class="ro">${esc(F.Notes)}</div>`:''}
      <div class="lbl">Details</div><div class="ro">Importance ${F.Priority} – ${PRI_LABEL[F.Priority]}${F.Tag?' · '+esc(F.Tag):''}<br>${fmt(F.Date,{weekday:'long',month:'long',day:'numeric'})}${F.Time?' at '+fmtRange(F.Time,F.EndTime):''}${F.Location?'<br>📍 '+esc(F.Location):''}${team?'<br>For: '+esc(F.AssignedTo||'Anyone'):''}</div>
      ${F.Checklist.length?`<div class="lbl">Steps</div>${cl}`:''}`;
  } else {
    const pri=[1,2,3].map(v=>`<button type="button" class="p${v} ${F.Priority===v?'on':''}" data-act="f-pri" data-v="${v}">${v} · ${PRI_LABEL[v]}</button>`).join('');
    const tags=TAGS.concat(['']).map(t=>`<button type="button" class="${F.Tag===t?'on':''}" data-act="f-tag" data-v="${t}">${t||'None'}</button>`).join('');
    const assign=team?`<label class="lbl" for="f_assign">Assign to</label><select class="field" id="f_assign"><option value="Anyone">Anyone (whoever is working)</option>${S.users.map(u=>`<option ${F.AssignedTo===u.name?'selected':''} value="${esc(u.name)}">${esc(u.name)}</option>`).join('')}</select>`:'';
    let rep='';
    if(F.isNew||F.mode==='rule'){
      const opts=(F.mode==='rule'?[]:[['none','Does not repeat']]).concat([['daily','Every day'],['weekdays','Every weekday (Mon–Fri)'],['weekly','Weekly on certain days'],['monthly','Monthly on the '+ordinal(dObj(F.Date).getUTCDate())]]);
      rep=`<label class="lbl" for="f_freq">Repeat</label><select class="field" id="f_freq" data-act="f-freq">${opts.map(([v,l])=>`<option value="${v}" ${F.Freq===v?'selected':''}>${l}</option>`).join('')}</select>`;
      if(F.Freq==='weekly') rep+=`<div class="seg days" style="margin-top:8px">${DOW.map((d,i)=>`<button type="button" class="${F.Days.indexOf(i)>=0?'on':''}" data-act="f-day" data-v="${i}">${d.slice(0,2)}</button>`).join('')}</div>`;
    }
    const isA=F.Kind==='appt';
    const kindSeg=`<div class="seg" style="margin-top:10px"><button type="button" class="${!isA?'on':''}" data-act="f-kind" data-v="">✓ To-do</button><button type="button" class="${isA?'on':''}" data-act="f-kind" data-v="appt">🕘 Meeting / appointment</button></div>`;
    const timeBlock=isA?
      `<label class="lbl" for="f_date">${F.mode==='rule'?'Starts on':'Date'}</label><input class="field" type="date" id="f_date" value="${F.Date}">
       <div class="row2"><div><label class="lbl" for="f_time">Start time</label><input class="field" type="time" id="f_time" value="${F.Time}"></div>
       <div><label class="lbl" for="f_end">End time (optional)</label><input class="field" type="time" id="f_end" value="${F.EndTime}"></div></div>
       <label class="lbl" for="f_loc">Location (optional)</label><input class="field" id="f_loc" value="${esc(F.Location)}" placeholder="Address, office, Zoom…" autocomplete="off">`:
      `<div class="row2"><div><label class="lbl" for="f_date">${F.mode==='rule'?'Starts on':'Date'}</label><input class="field" type="date" id="f_date" value="${F.Date}"></div>
       <div><label class="lbl" for="f_time">Time (optional)</label><input class="field" type="time" id="f_time" value="${F.Time}"></div></div>`;
    const canMove=F.mode==='item'||F.isNew;
    const whereSeg=canMove?`<div class="lbl">Where it goes</div><div class="seg"><button type="button" class="${!team?'on':''}" data-act="f-where" data-v="personal">👤 ${F.Owner&&F.Owner!==S.user.name&&!team?esc(first(F.Owner))+'’s planner':'My planner'}</button><button type="button" class="${team?'on':''}" data-act="f-where" data-v="team">👥 Team calendar</button></div>
      ${!F.isNew&&team!==(F.origType==='team')?`<div class="info">${team?'When you save, this moves to the <b>Team calendar</b> and everyone will see it.':'When you save, this moves off the Team calendar into <b>your own planner</b> — only you (and Clint) will see it.'}</div>`:''}`:'';
    body=`${kindSeg}${whereSeg}<label class="lbl" for="f_title">${isA?'What’s the meeting?':'What needs to be done?'}</label><input class="field" id="f_title" value="${esc(F.Title)}" placeholder="${isA?'e.g. Walkthrough with adjuster at Smith job':'e.g. Call the adjuster on the Smith job'}" autocomplete="off">
      <label class="lbl" for="f_notes">Notes</label><textarea class="field" id="f_notes" placeholder="Details, phone numbers, addresses…">${esc(F.Notes)}</textarea>
      <div class="lbl">Importance</div><div class="seg">${pri}</div>
      <div class="lbl">Category</div><div class="seg">${tags}</div>
      ${timeBlock}
      ${assign}${rep}
      <div class="lbl">${isA?'Agenda / steps':'Steps (checklist)'}</div>${cl}
      <div class="cladd"><input class="field" id="f_newstep" placeholder="Add a step…" autocomplete="off"><button type="button" class="btn ghost" data-act="cl-add">Add</button></div>`;
  }
  const delOK=!F.isNew&&(F.mode==='rule'?canDelete({Type:F.Type,Owner:F.Owner,CreatedBy:F.CreatedBy}):canDelete({Type:F.Type,Owner:F.Owner,CreatedBy:F.CreatedBy}));
  let foot;
  if(ro){
    foot=`<div class="foot">${F.mode==='item'?`<button class="btn accent" data-act="f-complete">${F.Completed?'Mark not done':'✓ Mark complete'}</button>`:''}<span class="sp"></span>
      ${F.Checklist.length&&F.mode==='item'?'<button class="btn ghost" data-act="f-savesteps">Save steps</button>':''}<button class="btn ghost" data-act="close-modal">Close</button></div>`;
  } else {
    foot=`<div class="foot">${delOK?'<button class="btn danger" data-act="f-delete">Delete</button>':''}<span class="sp"></span>
      <button class="btn ghost" data-act="close-modal">Cancel</button><button class="btn" data-act="f-save">Save</button></div>`;
  }
  m.innerHTML=`<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head"><h2>${title}</h2><button class="x" data-act="close-modal" aria-label="Close">✕</button></div>${info}${body}${foot}</div></div>`;
}
function closeModal(){F=null;renderModal()}

function saveForm(){
  syncForm();
  if(!F.Title.trim()){toast('Please type what needs to be done');document.getElementById('f_title').focus();return}
  const ns=document.getElementById('f_newstep'); if(ns&&ns.value.trim()) F.Checklist.push({t:ns.value.trim(),d:false});
  const checklist=F.Checklist.filter(x=>x.t.trim());
  const clStr=checklist.length?JSON.stringify(checklist):'';
  if(F.Kind==='appt'&&!F.Time){toast('Please pick a start time for the meeting');return}
  if(F.Kind==='appt'&&F.EndTime&&F.EndTime<=F.Time){toast('End time needs to be after the start time');return}
  const kindFields={Kind:F.Kind==='appt'?'appt':'',EndTime:F.Kind==='appt'?F.EndTime:'',Location:F.Kind==='appt'?F.Location.trim():''};
  const isRule=F.mode==='rule'||F.Freq!=='none';
  if(isRule){
    if(F.Freq==='weekly'&&!F.Days.length){toast('Pick at least one day of the week');return}
    const r={ID:F.mode==='rule'&&F.ID?F.ID:uid('r'),Type:F.Type,Owner:F.Owner,Title:F.Title.trim(),Notes:F.Notes,Priority:String(F.Priority),Tag:F.Tag,
      Time:F.Time,AssignedTo:F.Type==='team'?F.AssignedTo:'',Freq:F.Freq,Days:F.Freq==='weekly'?F.Days.slice().sort().join(','):(F.Freq==='monthly'?String(dObj(F.Date).getUTCDate()):''),
      StartDate:F.Date,Checklist:clStr,CreatedBy:F.CreatedBy||S.user.name,Active:'Yes',...kindFields};
    const wasNew=!(F.mode==='rule'&&!F.isNew);
    const i=S.rules.findIndex(x=>x.ID===r.ID); if(i>=0) S.rules[i]=Object.assign(S.rules[i],r); else S.rules.push(r);
    closeModal(); render();
    mutate('saveRule',{rule:r},wasNew?'Repeating item saved — it will show up on its days':'Repeating item updated');
    return;
  }
  const existing=F.ID?findItem(F.ID):null;
  const it=Object.assign(existing||{ID:uid('i'),Type:F.Type,Owner:F.Owner,CreatedBy:S.user.name,CreatedAt:new Date().toISOString(),Completed:'',CompletedDate:'',CompletedBy:'',RecurID:'',Deleted:''},
    {Title:F.Title.trim(),Notes:F.Notes,Priority:String(F.Priority),Tag:F.Tag,Date:F.Date,Time:F.Time,AssignedTo:F.Type==='team'?(F.AssignedTo||'Anyone'):'',Checklist:clStr,
     Type:F.Type,Owner:F.Type==='team'?'':(F.Owner||S.viewAs||S.user.name)},kindFields);
  if(!existing) S.items.push(it);
  closeModal(); render();
  mutate('saveItem',{item:it});
}
function deleteForm(){
  if(!confirm(F.mode==='rule'?'Delete this repeating item? Past days stay as they are; upcoming copies are removed.':'Delete this item?')) return;
  if(F.mode==='rule'){
    S.rules=S.rules.filter(r=>r.ID!==F.ID);
    const T=today(); S.items=S.items.filter(it=>!(it.RecurID===F.ID&&it.Date>T&&it.Completed!=='Yes'));
    const id=F.ID; closeModal(); render(); mutate('deleteRule',{id},'Repeating item deleted');
  } else {
    const id=F.ID; S.items=S.items.filter(it=>it.ID!==id); closeModal(); render(); mutate('deleteItem',{id},'Deleted');
  }
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act; const itemEl=el.closest('.item'); const id=itemEl&&itemEl.dataset.id;
  switch(act){
    case 'pickname': S.loginName=el.dataset.n;S.pin='';S.loginErr='';render();break;
    case 'key': pressKey(el.dataset.k);break;
    case 'loginback': S.loginName=null;S.pin='';S.loginErr='';render();break;
    case 'tab': S.tab=el.dataset.tab; if(S.tab==='week'){S.weekStart=weekStartOf(S.date);S.monthStart=monthStartOf(S.date)} render(); window.scrollTo(0,0); break;
    case 'day-prev': S.date=addDays(S.date,-1);render();break;
    case 'day-next': S.date=addDays(S.date,1);render();break;
    case 'go-today': S.date=today();render();break;
    case 'qpri': S.quickPri=+el.dataset.v;render();break;
    case 'tagf': S.tagFilter=el.dataset.v;render();break;
    case 'teamf': S.teamFilter=el.dataset.v;render();break;
    case 'toggle': if(id&&!el.disabled) toggleItem(id);break;
    case 'cycle': if(id) cyclePriority(id);break;
    case 'open': if(id){
      if(id.indexOf('rule:')===0){const r=S.rules.find(x=>x.ID===id.slice(5));if(r)openEditor({rule:r});break}
      const it=findItem(id);if(it)openEditor({item:it})}break;
    case 'new-full': openEditor({team:el.dataset.team==='1'});break;
    case 'new-appt': openEditor({team:el.dataset.team==='1',appt:true});break;
    case 'link': break; // let the map link open normally
    case 'f-kind': syncForm();F.Kind=el.dataset.v;renderModal();break;
    case 'f-where': syncForm();
      if(el.dataset.v==='team'){F.Type='team';if(!F.AssignedTo||F.AssignedTo==='')F.AssignedTo='Anyone'}
      else{F.Type='personal';if(!F.Owner)F.Owner=S.viewAs||S.user.name}
      renderModal();break;
    case 'newrule': openEditor({team:el.dataset.team==='1',ruleMode:true});break;
    case 'openrule': {const r=S.rules.find(x=>x.ID===el.dataset.id);if(r)openEditor({rule:r});break}
    case 'openres': {const it=findItem(el.dataset.id);if(it){S.date=it.Completed==='Yes'?it.CompletedDate:(it.Date<today()?today():it.Date);S.tab=it.Type==='team'?'team':'day';
      if(it.Type==='personal'&&isAdmin()) S.viewAs=it.Owner; S.tagFilter='all'; if(it.Type==='team') S.teamFilter='all'; render();openEditor({item:it})}break}
    case 'goday': S.date=el.dataset.d;S.tab=S.weekMode==='team'?'team':'day';render();window.scrollTo(0,0);break;
    case 'calview': S.calView=el.dataset.v;try{localStorage.setItem('vp_calview',S.calView)}catch(e){} render();break;
    case 'mo-prev': S.monthStart=shiftMonth(S.monthStart,-1);render();break;
    case 'mo-next': S.monthStart=shiftMonth(S.monthStart,1);render();break;
    case 'mo-today': S.monthStart=monthStartOf(today());render();break;
    case 'wk-prev': S.weekStart=addDays(S.weekStart,-7);render();break;
    case 'wk-next': S.weekStart=addDays(S.weekStart,7);render();break;
    case 'wk-today': S.weekStart=weekStartOf(today());render();break;
    case 'wkmode': S.weekMode=el.dataset.v;render();break;
    case 'theme-toggle': setTheme(isDark()?'light':'dark');break;
    case 'theme-set': setTheme(el.dataset.v);break;
    case 'refresh': refresh().then(()=>toast('Up to date'));break;
    case 'logout': if(confirm('Sign out of the planner on this device?')) logout();break;
    case 'savepin': {
      const a=document.getElementById('pin1').value, b=document.getElementById('pin2').value;
      if(!/^\d{4}$/.test(a)){toast('PIN must be 4 numbers');break}
      if(a!==b){toast('The two PINs don’t match');break}
      api('changePin',{newPin:a}).then(()=>{S.creds.pin=a;lsSet(LS.creds,S.creds);toast('PIN changed');render()}).catch(e=>toast(e.message));
      break}
    // editor
    case 'overlay': if(ev.target===el) {/* tapping outside does nothing, to avoid losing work */} break;
    case 'close-modal': closeModal();break;
    case 'f-pri': syncForm();F.Priority=+el.dataset.v;renderModal();break;
    case 'f-tag': syncForm();F.Tag=el.dataset.v;renderModal();break;
    case 'f-day': {syncForm();const v=+el.dataset.v;const i=F.Days.indexOf(v);if(i>=0)F.Days.splice(i,1);else F.Days.push(v);renderModal();break}
    case 'cl-add': {syncForm();const ns=document.getElementById('f_newstep');if(ns.value.trim()){F.Checklist.push({t:ns.value.trim(),d:false});renderModal();document.getElementById('f_newstep').focus()}break}
    case 'cl-rm': syncForm();F.Checklist.splice(+el.dataset.i,1);renderModal();break;
    case 'cl-toggle': syncForm();F.Checklist[+el.dataset.i].d=el.checked;renderModal();break;
    case 'f-save': saveForm();break;
    case 'f-delete': deleteForm();break;
    case 'f-savesteps': {const it=findItem(F.ID);if(it){it.Checklist=JSON.stringify(F.Checklist);mutate('saveChecklist',{id:F.ID,checklist:F.Checklist},'Steps saved')}closeModal();render();break}
    case 'f-complete': {const id2=F.ID;if(F.Checklist.length){const it=findItem(id2);if(it&&JSON.stringify(parseCL(it.Checklist))!==JSON.stringify(F.Checklist)){it.Checklist=JSON.stringify(F.Checklist);mutate('saveChecklist',{id:id2,checklist:F.Checklist})}}
      closeModal();toggleItem(id2);break}
  }
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='quickForm'){ev.preventDefault();quickSubmit(ev.target)}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='datePick'&&t.value){S.date=t.value;render()}
  else if(t.id==='viewAs'){S.viewAs=t.value===S.user.name?null:t.value;render()}
  else if(t.id==='f_freq'){syncForm();if(F.Freq==='weekly'&&!F.Days.length)F.Days=[dObj(F.Date).getUTCDay()];renderModal()}
  else if(t.id==='f_date'&&F&&(F.isNew||F.mode==='rule')){syncForm();renderModal()}
  else if(t.id==='quickAssign'){S.quickAssign=t.value}
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='searchInput'){S.search=ev.target.value;clearTimeout(render._s);render._s=setTimeout(render,150)}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&F) closeModal();
  if(ev.key==='Enter'&&ev.target.id==='f_newstep'){ev.preventDefault();document.querySelector('[data-act="cl-add"]').click()}
  if(!S.user&&S.loginName&&/^[0-9]$/.test(ev.key)) pressKey(ev.key);
  if(!S.user&&S.loginName&&ev.key==='Backspace') pressKey('⌫');
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!S.user) return;
  const T=today(); if(T!==lastToday){if(S.date===lastToday)S.date=T;lastToday=T}
  if(pending===0&&!F) refresh(true); else render();
});
setInterval(()=>{
  if(document.visibilityState==='visible'&&S.user&&pending===0&&!F) refresh(true);
  const T=today(); if(T!==lastToday&&S.user){if(S.date===lastToday)S.date=T;lastToday=T;render()}
},60000);

/* ---------- start up ---------- */
(function init(){
  applyThemeColor();
  if(API_URL.indexOf('PASTE_')===0){render();return}
  const creds=lsGet(LS.creds), cache=lsGet(LS.cache), users=lsGet(LS.users);
  if(users) S.users=users;
  if(creds&&creds.name){
    S.creds=creds;
    if(cache&&cache.user===creds.name){
      // show last-known data instantly, then refresh in the background
      S.user={name:creds.name,role:(S.users.find(u=>u.name===creds.name)||{}).role||'staff',color:(S.users.find(u=>u.name===creds.name)||{}).color||'#888'};
      S.items=cache.items||[];S.rules=cache.rules||[];S.users=cache.users||S.users;render();
    }
    refresh(false);
  } else { render(); loadUsers(); }
})();
</script>
</body>
</html>
